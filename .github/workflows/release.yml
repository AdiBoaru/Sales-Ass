# NX-248 — Release: build O SINGURĂ DATĂ, promovează prin DIGEST.
#
# Fluxul vechi (`deploy.yml`) construia la fiecare push pe `main`, publica `latest` și intra prin
# SSH cu `git pull && docker compose pull && up -d`. Trei probleme, fiecare fatală separat:
#
#   • `latest` e mutabil: între `pull` și `up` conținutul se poate schimba, iar „rollback la
#     latest" nu e o operație, ci o speranță;
#   • `git pull` pe VPS înseamnă că host-ul decide ce configurație rulează, nu releaseul;
#   • un push pe `main` DEVENEA un deploy în producție, fără aprobare umană.
#
# Aici: un commit produce UN artefact, cu digest, SBOM, provenance, semnătură și raport de scan.
# Același digest merge în staging, e verificat prin smoke, apoi — și numai după o aprobare umană
# pe environmentul `production` — e promovat. Nu se reconstruiește nimic la promovare: „ce am
# testat" și „ce rulează" sunt același șir de 64 de caractere.
#
# Ce NU face acest workflow: nu alege cohorta de canary și nu execută cutoverul v1→v2 (NX-249).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: "Digestul (sha256:…) de promovat în producție. Gol = doar build + staging."
        required: false
        type: string
      rollback:
        description: "Promovare de ROLLBACK (digest anterior). Sare peste build."
        required: false
        default: false
        type: boolean
      build_run_id:
        description: >-
          ID-ul rulării care a CONSTRUIT digestul (e în URL-ul acelei rulări). De acolo se ia
          `manifest.json`. Digestul din manifest se compară cu cel cerut, deci un ID greșit e
          respins, nu folosit tăcut.
        required: false
        type: string
      first_release:
        description: >-
          PRIMUL release: acceptă că nu există țintă de rollback. Bifează DOAR dacă știi că nu a
          mai fost promovat nimic prin pipeline — din manifest, „primul release" și „manifestul
          precedent n-a putut fi citit" arată identic.
        required: false
        default: false
        type: boolean
      previous_build_run_id:
        description: >-
          BOOTSTRAP: ID-ul rulării care a construit imaginea care rulează ACUM în producție
          (championul). Necesar o singură dată — prima promovare de după introducerea artefactului
          `champion-manifest` nu are de unde să-l citească. După ea, championul se rezolvă singur.
        required: false
        type: string

# Un singur release în zbor. `cancel-in-progress: false` — un deploy întrerupt la jumătate e mai
# rău decât un deploy care așteaptă.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/adiboaru/sales-ass

jobs:
  # ── 1. BUILD: o singură dată, cu artefactele care îl fac verificabil ───────────────────────
  build:
    name: Build + atestări
    # O promovare (`digest` completat) NU reconstruiește nimic: artefactul există deja, iar un
    # build nou ar produce alt digest și alt manifest, în paralel cu jobul care promovează.
    if: ${{ !inputs.rollback && inputs.digest == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC pentru semnătura keyless cosign
      actions: read # citește artefactul `champion-manifest` din rularea precedentă
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Timestamp de build (o singură sursă pentru toate etichetele)
        id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push (SBOM + provenance atașate)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # Tagurile sunt POINTERI PENTRU OAMENI. Deployul folosește exclusiv digestul de mai jos.
          # `latest` rămâne ca să nu rupem uneltele care îl caută, dar nimic din release nu-l citește.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Semnează imaginea (keyless, identitate = acest workflow)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Scanul e FAIL-CLOSED pe critical/high CU FIX DISPONIBIL. Excepțiile trăiesc în
      # `.trivyignore.yaml` cu CVE, motiv, owner și `expired_at` — `continue-on-error` ar
      # transforma poarta într-o notificare.
      #
      # Cele trei opțiuni de mai jos au fost fiecare un defect măsurat pe 2026-08-19, care
      # împreună au ținut pipeline-ul roșu de la prima rulare (zero deployuri promovate):
      #
      # `ignore-unfixed: true` — era `false`, adică poarta pica și pe vulnerabilități pentru care
      #   NU EXISTĂ patch publicat. Măsurat pe imaginea reală: 17 din 26 de finding-uri erau
      #   `affected`/`fix_deferred`, toate în pachete Debian de bază pe care aplicația nu le
      #   folosește (4 CRITICAL, toate în `perl-base`, într-un serviciu Python care nu invocă
      #   niciodată perl). Nicio acțiune a noastră nu le putea închide. O poartă pe care nimeni
      #   nu o poate trece nu filtrează nimic — se ocolește, și exact asta s-a întâmplat:
      #   producția a fost actualizată manual, prin SSH, fără scan, fără staging și fără smoke.
      #   Cele fără fix rămân VIZIBILE (raportul se încarcă mai jos, inclusiv când poarta e roșie)
      #   și sunt re-evaluate săptămânal de `security-rescan.yml`, care anunță când apare un fix.
      #
      # `limit-severities-for-sarif: true` — fără el, `severity` de mai jos era DECORATIV.
      #   `entrypoint.sh` al acțiunii face `unset TRIVY_SEVERITY` când formatul e `sarif` și
      #   opțiunea asta lipsește („Building SARIF report with all severities" — linia apare chiar
      #   în logul rulărilor picate). Adică poarta declara CRITICAL,HIGH și impunea „zero
      #   vulnerabilități de ORICE severitate", inclusiv LOW. Măsurat: încă 5 finding-uri
      #   MEDIUM/LOW în `pip` ar fi ținut buildul roșu după ce celelalte două erau reparate.
      #   Regula declarată și regula impusă sunt acum același lucru.
      #
      # `trivyignores: .trivyignore.yaml` — formatul simplu nu are câmp de expirare, deci
      #   `# expiră 2026-09-01` era un comentariu, iar regula din antetul fișierului („o excepție
      #   expirată face buildul roșu") era neexecutabilă. YAML-ul are `expired_at`, pe care Trivy
      #   îl aplică.
      - name: Scan vulnerabilități (OS + Python)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      # `if: always()` fiindcă pasul de scan iese cu 1 când găsește ceva, iar pașii următori se
      # sar — inclusiv artefactul de evidență de la finalul jobului. Adică exact când raportul e
      # cel mai necesar, el se pierdea: lista de CVE-uri care a ținut pipeline-ul blocat a trebuit
      # reprodusă rulând Trivy local pe digestul din producție, fiindcă în CI nu rămăsese nimic.
      #
      # Artefact, nu GitHub Code Scanning: încărcarea SARIF-ului de la Trivy în Code Scanning e
      # cunoscut fragilă în jurul versiunii pe care o rulăm (0.70.0) — `artifactLocation.uri` gol
      # și căi de fișier inexistente sunt respinse la upload. Un artefact nu poate eșua din motive
      # de format.
      - name: Raportul de scan (păstrat inclusiv când poarta e roșie)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-scan-${{ github.run_id }}
          path: trivy.sarif
          if-no-files-found: warn
          retention-days: 90

      - name: Contractul de imagine (non-root, conținut, zero secrete)
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          python scripts/release/image_contract.py "${IMAGE}@${DIGEST}" --canary "${CANARY}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          # Canary injectat DOAR în mediul jobului: dacă apare în imagine, ceva scurge env-ul de CI.
          CANARY: nx248-canary-${{ github.run_id }}

      # Poarta de rollback are nevoie de o ȚINTĂ, iar ținta e `previous_digest` din manifest.
      # `build_manifest.py` acceptă `--previous` de la început, dar nimeni nu i-l pasa: argumentul
      # lipsea din pasul de mai jos. Efectul, măsurat pe 2026-08-24: `previous_digest` ieșea gol la
      # ORICE build, `rollback_possible()` răspundea „fără digest precedent (primul release)", iar
      # singura cale prin poartă rămânea `first_release: true` — o declarație care la a doua
      # promovare e pur și simplu falsă. Nu era o scăpare formală: `scripts/release/rollback.py`
      # își ia ținta EXCLUSIV din `previous_digest`, deci procedura de rollback din runbook n-avea
      # pe ce rula. Aceeași clasă de defect ca poarta de scan din #301 — o poartă pe care nimeni nu
      # o poate trece nu filtrează nimic, se ocolește.
      #
      # Championul se rezolvă în două trepte, în ordinea încrederii:
      #   1. `previous_build_run_id`, DECLARAT de om — doar pentru bootstrap: prima promovare de
      #      după acest fix nu are de unde să citească artefactul de la treapta 2.
      #   2. artefactul `champion-manifest`, scris de FIECARE promovare reușită. De la a doua
      #      promovare încolo treapta asta ajunge, și nu se mai cere nimic de la tastatură.
      # Fără niciuna, `--previous` lipsește și `previous_digest` rămâne gol — adică poarta
      # blochează. Ăsta e comportamentul CORECT pentru un release cu adevărat primul, și e
      # explicit, nu tăcut.
      #
      # Limită cunoscută: `previous_digest` se fixează la BUILD. Dacă un build stă nepromovat cât
      # timp altcineva promovează, ținta lui e championul de atunci, nu cel de acum. Mitigarea e în
      # runbook (§1.3): promovezi buildul curent, nu unul vechi; altfel reconstruiești.
      - name: Rezolvă championul (ținta de rollback)
        id: champion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DECLARED_RUN: ${{ inputs.previous_build_run_id }}
        run: |
          set -eo pipefail
          mkdir -p champion
          if [ -n "${DECLARED_RUN}" ]; then
            # Bootstrap: manifestul championului e artefactul de evidență al BUILDULUI lui.
            run_id="${DECLARED_RUN}"
            artifact="release-evidence-${run_id}"
            echo "champion DECLARAT: run ${run_id}"
          else
            run_id="$(gh api "repos/${REPO}/actions/artifacts?name=champion-manifest&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)]
                    | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
            artifact="champion-manifest"
            if [ -n "${run_id}" ]; then
              echo "champion din artefact: run ${run_id}"
            else
              echo "niciun champion înregistrat — manifestul va ieși fără țintă de rollback"
              echo "previous=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gh run download "${run_id}" -R "${REPO}" -n "${artifact}" -D champion
          echo "previous=champion/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Manifest de deploy (release, digest, config, interval de schemă)
        run: |
          prev_args=()
          [ -n "${PREVIOUS}" ] && prev_args=(--previous "${PREVIOUS}")
          python scripts/release/build_manifest.py \
            --image "${IMAGE}" \
            --digest "${DIGEST}" \
            --release-sha "${{ github.sha }}" \
            --built-at "${{ steps.meta.outputs.built_at }}" \
            --run-id "${{ github.run_id }}" \
            "${prev_args[@]}" \
            --out manifest.json
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS: ${{ steps.champion.outputs.previous }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            manifest.json
            trivy.sarif
          if-no-files-found: error
          retention-days: 90

  # ── 2. STAGING: același digest, verificat semantic ────────────────────────────────────────
  # Poarta `vars.STAGING_ENABLED`: fără ea, jobul ăsta pică la primul pas care are nevoie de un
  # secret `STAGING_*` — și niciunul nu există, fiindcă nu există un mediu de staging. Un pas care
  # nu poate reuși prin nicio acțiune a noastră nu filtrează nimic; înroșește releaseul la fiecare
  # rulare și te învață să nu te mai uiți la el. Exact greșeala reparată la pasul de scan, cu altă
  # față. Preferăm `skipped` — care se citește ca „nu se aplică" — în locul unui `failure` care
  # minte.
  #
  # `vars`, nu `secrets`: contextul `secrets` nu e disponibil în `if` la nivel de job, deci
  # „există secretele?" nu se poate întreba aici. Ca să pornești staging: adaugă cele 7 secrete
  # `STAGING_*` în environmentul `staging` și setează variabila de repo `STAGING_ENABLED=true`.
  # Comutatorul e explicit și separat de secrete tocmai ca pornirea să fie o decizie, nu un efect
  # secundar al adăugării unui secret.
  staging:
    name: Staging (același digest)
    needs: build
    if: ${{ !inputs.rollback && vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging # secrete + aprobări separate de producție
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Verificarea se face ÎNAINTE de a atinge hostul: o semnătură validată după deploy răspunde
      # la întrebarea greșită.
      - name: Verifică semnătura (repo + workflow, nu doar „e semnată")
        run: |
          # `--certificate-identity` EXACT, nu regexp. Regexul avea `adiboaru/sales-ass`
          # (lowercase, copiat din numele imaginii — registrele Docker CER lowercase), dar
          # identitatea din certificatul OIDC poartă numele REAL al repo-ului, cu majusculele
          # lui: `AdiBoaru/Sales-Ass`. Semnătura era validă; verificarea o căuta sub alt nume.
          # Măsurat 2026-08-19, la prima promovare care a ajuns până aici (exit 12, no
          # matching signatures). `github.repository` dă exact forma din certificat și rămâne
          # corect la o redenumire — două convenții pentru același nume nu mai pot diverge.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      # Preflight: migrări, compatibilitate de schemă, config. Read-only pe DB-ul de staging.
      - name: Preflight (schemă + compatibilitate + config)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ENV: staging
        run: python scripts/release/preflight.py --manifest-digest "${{ needs.build.outputs.digest }}"

      # Migrarea rulează ca JOB SEPARAT, cu credentialul de DDL, înainte de a porni serviciile.
      - name: Migrare (job dedicat, lock, expand/contract)
        env:
          DATABASE_URL_MIGRATION: ${{ secrets.STAGING_DATABASE_URL_MIGRATION }}
          ENV: staging
        run: python scripts/migrate.py --json

      - name: Deploy staging (digest, fără git pull, fără build)
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: ./scripts/release/deploy.sh staging

      - name: Smoke WebWidget v2 (bootstrap → accept → terminal → replay)
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_PUBLIC_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
        run: python scripts/release/smoke_web_v2.py --json --out smoke.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-smoke-${{ github.run_id }}
          path: smoke.json
          if-no-files-found: error
          retention-days: 90

  # ── 3. PRODUCȚIE: aprobare umană, același digest, zero build ──────────────────────────────
  # Nu depinde de `push`: se declanșează DOAR prin `workflow_dispatch` cu un digest explicit.
  # Un merge în `main` nu mai este o aprobare de deploy.
  production:
    name: Producție (promovare prin digest)
    if: ${{ inputs.digest != '' }}
    runs-on: ubuntu-latest
    environment: production # ← aprobarea umană trăiește aici, în GitHub Environments
    permissions:
      contents: read
      id-token: write
      actions: read # descarcă manifestul buildului promovat (altă rulare)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verifică semnătura digestului de promovat
        run: |
          # `--certificate-identity` EXACT, nu regexp. Regexul avea `adiboaru/sales-ass`
          # (lowercase, copiat din numele imaginii — registrele Docker CER lowercase), dar
          # identitatea din certificatul OIDC poartă numele REAL al repo-ului, cu majusculele
          # lui: `AdiBoaru/Sales-Ass`. Semnătura era validă; verificarea o căuta sub alt nume.
          # Măsurat 2026-08-19, la prima promovare care a ajuns până aici (exit 12, no
          # matching signatures). `github.repository` dă exact forma din certificat și rămâne
          # corect la o redenumire — două convenții pentru același nume nu mai pot diverge.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ github.repository }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      # Poarta care face rollbackul posibil: dacă imaginea PRECEDENTĂ nu mai tolerează schema
      # curentă, releaseul se oprește ACUM, nu în incident.
      # Preflight primea DOAR `--manifest-digest` (un șir), niciodată `--manifest` (un FIȘIER) —
      # două argumente diferite. Fără fișier, `--require-rollback-possible` cădea imediat pe
      # „cere --manifest (altfel nu există țintă)", deci promovarea era imposibilă indiferent de
      # conținut. Manifestul e artefact de build; jobul de producție nu-l descărca deloc.
      - name: Descarcă manifestul buildului promovat
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: release-evidence-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Preflight producție (inclusiv fezabilitatea rollbackului)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ENV: prod
        run: |
          python scripts/release/preflight.py             --manifest manifest.json             --manifest-digest "${{ inputs.digest }}"             --require-rollback-possible             ${{ inputs.first_release && '--allow-no-previous-digest' || '' }}

      - name: Migrare (job dedicat, credential de DDL)
        if: ${{ !inputs.rollback }}
        env:
          DATABASE_URL_MIGRATION: ${{ secrets.PROD_DATABASE_URL_MIGRATION }}
          ENV: prod
        run: python scripts/migrate.py --json

      - name: Deploy producție (digest, fără git pull, fără build)
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: ./scripts/release/deploy.sh production

      # `SMOKE_BASE_URL` e API-ul (`WEBHOOK_HOST`, ex. https://bot.…), NU vitrina care încarcă
      # widgetul (https://demo.…). Vitrina e un SPA cu catch-all: răspunde 200 + HTML la ORICE
      # cale, deci `/health/ready` ar întoarce o pagină, iar smoke-ul ar muri cu `JSONDecodeError`
      # — o eroare care nu spune nimic despre cauza reală.
      #
      # Profilul (v1/v2) se detectează din ce servește instanța și ajunge în raport. La cutoverul
      # NX-249, adaugă `SMOKE_EXPECT_PROFILE: v2` aici: din acel moment, o cădere tăcută înapoi pe
      # v1 (flag stins din greșeală) devine eșec în loc de smoke verde pe alt contract.
      - name: Smoke producție (tenant de test dedicat)
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          SMOKE_PUBLIC_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
        run: python scripts/release/smoke_web_v2.py --json --out smoke-prod.json

      # Până aici, smoke-ul DETECTA o promovare stricată, dar nu o repara: cineva trebuia să
      # citească logul și să ruleze rollbackul de mână. Fereastra dintre „deploy verde, smoke roșu"
      # și „un om observă" era timp de nefuncționare pentru clienți.
      #
      # Un rollback E un deploy al digestului precedent, deci refolosim `deploy.sh` — singurul drum
      # testat către host (digest validat, `.env` rescris pe o linie, așteptare de health). Un al
      # doilea mecanism de atins producția ar fi exact cel care nu e exersat când chiar contează.
      #
      # De ce e SIGUR să revii peste o migrare care tocmai a rulat: `--require-rollback-possible` a
      # verificat ÎNAINTE de deploy că imaginea precedentă tolerează schema aplicată. Poarta aia
      # (reparată în #313, până atunci netrecută niciodată) e chiar precondiția care face automat
      # ce altfel ar fi fost o decizie de judecată în incident.
      #
      # Trei condiții, fiecare pentru un mod distinct de a face rău:
      #   • `!inputs.rollback` — o promovare de rollback care pică NU se „repară" revenind, fiindcă
      #     întoarcerea ei e chiar versiunea stricată de la care fugim;
      #   • outcome-ul pașilor — dacă preflight a picat, hostul n-a fost atins, iar un „rollback"
      #     ar reporni containerele degeaba (downtime pentru nimic);
      #   • țintă existentă — fără `previous_digest` nu există unde să revii; atunci spunem clar
      #     că e nevoie de om, în loc să eșuăm tăcut.
      - name: Rollback automat (deployul sau smoke-ul au picat)
        id: rollback
        if: >-
          ${{ always() && !inputs.rollback
              && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -eo pipefail
          target="$(python -c "import json; print(json.load(open('manifest.json'))['previous_digest'])")"
          if [ -z "${target}" ]; then
            echo "::error::deploy/smoke au picat, dar manifestul n-are țintă de rollback."
            echo "Producția rămâne pe digestul promovat. Intervenție MANUALĂ: RELEASE-RUNBOOK §4."
            exit 1
          fi
          echo "::warning::rollback automat către ${target}"
          IMAGE_DIGEST="${target}" ./scripts/release/deploy.sh production

      # Un rollback neverificat e o speranță. `deploy.sh` așteaptă deja containerul healthy, dar
      # health ≠ servește corect — smoke-ul e singurul care trece printr-un tur real.
      - name: Verifică rollbackul (smoke pe versiunea revenită)
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          SMOKE_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          SMOKE_PUBLIC_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
        run: python scripts/release/smoke_web_v2.py --json --out smoke-rollback.json

      # `always()`, din exact motivul pentru care raportul de scan îl are (vezi jobul de build):
      # fără el, artefactul se pierdea EXACT când e cel mai necesar — la promovarea picată, pe un
      # mediu pe care poate nu-l mai poți reproduce. `warn`, nu `error`: dacă smoke-ul n-a apucat
      # să ruleze, absența fișierului nu e un al doilea eșec de raportat.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-evidence-${{ github.run_id }}
          path: |
            smoke-prod.json
            smoke-rollback.json
          if-no-files-found: warn
          retention-days: 365

      # Ce rulează în producție devine ținta de rollback a buildurilor următoare. Se scrie ABIA
      # aici, după smoke: un digest care n-a trecut de smoke nu e champion, deci nu e nici o țintă
      # spre care ai vrea să te întorci.
      #
      # Numele e STABIL între rulări, tocmai ca buildul să poată cere „cel mai recent champion"
      # fără să știe ID-uri. Retenția e maximă: dacă artefactul expiră, buildul rămâne fără țintă
      # și poarta blochează — recuperabil cu `previous_build_run_id`, dar mai bine să nu se ajungă.
      #
      # NU adăuga `if: always()` aici. Pasul se bazează pe `if: success()`-ul implicit: dacă smoke-ul
      # a picat și s-a făcut rollback, championul a RĂMAS cel vechi. Înregistrarea manifestului nou
      # ar declara champion tocmai digestul de la care am fugit, iar buildul următor și-ar lua ținta
      # de rollback dintr-o versiune despre care ȘTIM că nu servește. Garda e în teste.
      - name: Înregistrează championul (ținta de rollback pentru buildurile următoare)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: champion-manifest
          path: manifest.json
          if-no-files-found: error
          retention-days: 365
