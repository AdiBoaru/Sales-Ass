# DEPRECAT (NX-248) — înlocuit de `.github/workflows/release.yml`.
#
# Workflow-ul ăsta construia la fiecare push pe `main`, publica `latest` și intra prin SSH cu
# `git pull && docker compose pull && up -d`. Trei proprietăți pe care nu le putea avea:
#
#   • **artefact identificabil** — `latest` e mutabil, deci „ce am testat" ≠ neapărat „ce rulează",
#     iar rollbackul nu era o operație declarată, ci o repornire cu degetele încrucișate;
#   • **aprobare umană** — un merge în `main` DEVENEA un deploy în producție;
#   • **trust la margine** — `StrictHostKeyChecking=no` + `ssh-keyscan` la fiecare rulare
#     înseamnă „acceptă orice host care răspunde la IP-ul ăsta", adică exact ce nu vrei de la
#     canalul prin care livrezi cod în producție.
#
# TRIGGER-UL AUTOMAT E SCOS. Fișierul rămâne (fără `on: push`) ca fallback documentat până la
# primul release complet prin `release.yml`, conform planului de rollout din card. Rularea lui
# cere confirmare scrisă explicit — nu ca birocrație, ci fiindcă un buton „Run workflow" apăsat
# din reflex nu trebuie să poată ocoli poarta pe care tocmai am construit-o.
#
# Ștergerea acestui fișier: după primul deploy de producție promovat prin digest (vezi
# docs/RELEASE-RUNBOOK.md §Retragerea fallbackului).
name: Deploy to VPS (DEPRECAT — fallback)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Scrie exact: OCOLESC-RELEASE-YML (motivul, în rezumatul rulării)"
        required: true
        type: string
      reason:
        description: "De ce nu se poate folosi release.yml acum?"
        required: true
        type: string

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/adiboaru/sales-ass

jobs:
  guard:
    name: Poartă (confirmare explicită)
    runs-on: ubuntu-latest
    steps:
      - name: Refuză dacă confirmarea nu e exactă
        run: |
          if [ "${{ inputs.confirm }}" != "OCOLESC-RELEASE-YML" ]; then
            echo "::error::Confirmare lipsă sau greșită. Calea normală e release.yml (deploy prin digest semnat)."
            exit 1
          fi
          {
            echo "## Deploy prin calea DEPRECATĂ"
            echo "Motiv: ${{ inputs.reason }}"
            echo "Actor: ${{ github.actor }}"
            echo ""
            echo "Acest deploy NU are digest verificat, NU are semnătură verificată și NU a trecut"
            echo "prin smoke pe staging. Notează-l în docs/RELEASE-RUNBOOK.md §Excepții."
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    name: Build + deploy (fără garanțiile NX-248)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imaginea
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chiar și pe calea deprecată, deployul merge prin DIGEST și cu host key pin-uit: fallbackul
      # nu are voie să reintroducă exact vulnerabilitățile pentru care a fost înlocuit.
      - name: Deploy (digest, host key pin-uit)
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: ./scripts/release/deploy.sh production
